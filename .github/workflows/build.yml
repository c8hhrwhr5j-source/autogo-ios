name: Build AutoGo IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install dependencies
        run: |
          brew install xcodegen ldid 2>/dev/null || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project AutoGo.xcodeproj \
            -scheme AutoGo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            OTHER_LDFLAGS="\$(inherited) -Wl,-undefined,dynamic_lookup"

      - name: Sign with ldid
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -name "AutoGo.app" -type d | head -1)
          echo "App: $APP"
          echo "Entitlements:"
          cat "${GITHUB_WORKSPACE}/AutoGo/Entitlements.entitlements"
          ldid -S"${GITHUB_WORKSPACE}/AutoGo/Entitlements.entitlements" "$APP/AutoGo"

      - name: Create IPA
        run: |
          APP_DIR=$(find build/DerivedData/Build/Products/Release-iphoneos -name "AutoGo.app" -type d | head -1)
          echo "Found app at: $APP_DIR"
          mkdir -p build/output/Payload
          cp -R "$APP_DIR" build/output/Payload/
          cd build/output
          zip -qr AutoGo.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGo-iOS-TrollStore
          path: build/output/AutoGo.ipa
