name: Build AutoGo IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install dependencies
        run: |
          brew install xcodegen ldid 2>/dev/null || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project AutoGo.xcodeproj \
            -scheme AutoGo \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            -archivePath build/AutoGo.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Create IPA
        run: |
          mkdir -p build/output/Payload
          cp -R build/AutoGo.xcarchive/Products/Applications/AutoGo.app build/output/Payload/
          cd build/output
          zip -qr AutoGo.ipa Payload
          rm -rf Payload

      - name: Sign with ldid
        run: |
          ldid -SAutoGo/Entitlements.entitlements build/AutoGo.xcarchive/Products/Applications/AutoGo.app/AutoGo

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGo-iOS-TrollStore
          path: build/output/AutoGo.ipa
