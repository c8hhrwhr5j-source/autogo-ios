name: AutoLua
options:
  bundleIdPrefix: com.autolua
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base: AutoLua.xcconfig

targets:
  AutoLua:
    type: application
    platform: iOS
    sources:
      - path: AutoLua/Sources
      - path: AutoLua/Lua
      - path: AutoLua
    resources:
      - path: AutoLua/Resources
    settings:
      base:
        INFOPLIST_FILE: AutoLua/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.autolua.ios
        CODE_SIGN_ENTITLEMENTS: AutoLua/Entitlements.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "5.0"
        GCC_PREPROCESSOR_DEFINITIONS: "AUTOLUA_ENABLE_LUA=1"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/AutoLua/Lua"
    dependencies:
      - sdk: Network.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
    preBuildScripts:
      - name: "Clean Build"
        script: |
          echo "Building AutoLua..."
