name: AutoGo
options:
  bundleIdPrefix: com.autogo
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base: AutoGo.xcconfig

targets:
  AutoGo:
    type: application
    platform: iOS
    sources:
      - path: AutoGo/Sources
    resources:
      - path: AutoGo/Resources
    settings:
      base:
        INFOPLIST_FILE: AutoGo/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.autogo.ios
        CODE_SIGN_ENTITLEMENTS: AutoGo/Entitlements.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "5.0"
    dependencies: []
    preBuildScripts:
      - name: "Clean Build"
        script: |
          echo "Building AutoGo..."
