name: AutoGo
targets:
  AutoGo:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: AutoGo
        excludes:
          - Info.plist
          - AutoGo.entitlements
          - BridgeHeader.h
          - Resources/Assets.xcassets
          - Resources/LaunchScreen.storyboard
          - Resources/web
      - path: AutoGo/Resources/Assets.xcassets
        type: folder
      - path: AutoGo/Resources/LaunchScreen.storyboard
      - path: AutoGo/Resources/web
        type: folder
    settings:
      base:
        INFOPLIST_FILE: AutoGo/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoGo/AutoGo.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: AutoGo/BridgeHeader.h
        PRODUCT_BUNDLE_IDENTIFIER: com.autogo.ios
        PRODUCT_NAME: AutoGo
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_MODULES: YES
        DEFINES_MODULE: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "iPhone Developer"
        PROVISIONING_PROFILE_SPECIFIER: ""
        FRAMEWORK_SEARCH_PATHS: "$(inherited)"
        OTHER_LDFLAGS: "-ObjC -lz -lsqlite3"
    configFiles:
      Debug: AutoGo.xcconfig
      Release: AutoGo.xcconfig
    info:
      path: AutoGo/Info.plist
    scheme:
      AutoGo:
        build:
          targets:
            AutoGo: all
        run:
          config: Debug
        archive:
          config: Release
